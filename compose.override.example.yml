# A compose override is optional. Config is generally done in `.env`, so this
# is basically for structural setup.

services:
  # Only use this if you have a DB dump you want to import
  db:
    volumes:
      - ./exports/db:/docker-entrypoint-initdb.d/

  # Development alternative: run the live-reload dev server instead of the
  # compiled production bundle. The bind mount lets you edit your
  # dspace-angular checkout on the host and see changes without rebuilding;
  # the named volumes keep the image's node_modules and the angular cache
  # from being shadowed by the mount. After changing dependencies, rebuild
  # the image and remove the node-modules volume so it gets reseeded.
  #angular:
  #  build:
  #    target: dev
  #  volumes:
  #    - ./dspace-angular:/app
  #    - node-modules:/app/node_modules
  #    - angular-cache:/app/.angular

# Development: the two volumes we added on the "angular" service have to be
# defined since they're not part of the base compose setup. Then, if desired,
# redefine `caddy-conf` for testing out caddyfile drop-ins. NOTE: for volumes
# that compose doesn't fully manage (`DEV-VOLS/caddy-conf.d` in this example),
# you have to create the directory manually.
#
