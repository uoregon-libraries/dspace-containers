# A minimal compose override is needed to expose Caddy. All config is done in
# `.env`, so this is for structural settings only. If you absolutely need to
# override an unexposed environment variable, please *fix* the compose spec /
# image definitions / etc. Don't just muddy up your override.

services:
  web:
    # Expose caddy to your host - this is required
    ports:
      - 0.0.0.0:8080:80
    # Expose smtpdebug's captured emails at /.smtp-debug/ (restricted to
    # CADDY_ADMIN_CIDR). Caddy only enables that route when this mount exists,
    # so drop it along with the smtpdebug service.
    volumes:
      - smtp-debug-logs:/var/local/smtp-debug-logs:ro

  # Only use this if you have a DB dump you want to import
  db:
    volumes:
      - ./exports/db:/docker-entrypoint-initdb.d/

  # Set SAML environment variables if using the SAML authentication module. There may be other
  # necessary variables to set depending on the IDP, for which references can be found in 
  # `dspace-rest/dspace/config/modules/saml-relying-party.cfg`.
  rest:
    environment:
      plugin__P__sequence__P__org__P__dspace__P__authenticate__P__AuthenticationMethod: >-
        org.dspace.authenticate.IPAuthentication,
        org.dspace.authenticate.PasswordAuthentication
      authentication__D__ip__P__UO\ Only: ${AUTHENTICATION_IPS:-}
      # authentication__D__saml__P__relying__D__party__D__id: sso 
      # authentication__D__saml__P__autoregister: ${SAML_AUTOREGISTER:?false}
      # # These config option names depend on the relying party id defined above. 
      # # If changing the id, the variable names including the id (sso) must also be updated.
      # saml__D__relying__D__party__P__sso__P__asserting__D__party__P__metadata__D__uri: ${SAML_IDP_METADATA_URI:?SAML_IDP_METADATA_URI must be set}
      # saml__D__relying__D__party__P__sso__P__attributes: ${SAML_ATTRIBUTES:?SAML_ATTRIBUTES must be set}

      # saml__D__relying__D__party__P__sso__P__signing__P__credentials__P__0__P__private__D__key__D__location: file:///run/secrets/test-scholarsbank.key
      # saml__D__relying__D__party__P__sso__P__signing__P__credentials__P__0__P__certificate__D__location: file:///run/certs/test-scholarsbank.crt

      # rest__P__cors__P__allowed__D__origins: ${REST_ALLOWED_ORIGINS:?REST_ALLOWED_ORIGINS must be set}
    volumes:
     - ./exports/solr:/usr/local/dspace/solr-export

    # Not necessary when developing locally. Used for SAML authentication on the test and production servers
    #  - /location/of/key.key:/run/secrets/test-scholarsbank.key:ro,Z
    #  - /location/of/cert.crt:/run/certs/test-scholarsbank.crt:ro,Z

  # Development alternative: run the live-reload dev server instead of the
  # compiled production bundle. The bind mount lets you edit your
  # dspace-angular checkout on the host and see changes without rebuilding;
  # the named volumes keep the image's node_modules and the angular cache
  # from being shadowed by the mount. After changing dependencies, rebuild
  # the image and remove the node-modules volume so it gets reseeded.
  #angular:
  #  build:
  #    target: dev
  #  volumes:
  #    - ./dspace-angular:/app
  #    - node-modules:/app/node_modules
  #    - angular-cache:/app/.angular

  # SMTP debug service: this is mandatory for testing emails in dev. Set the
  # MAIL_SERVER var to "smtpdebug" for this to work.
  smtpdebug:
    build:
      context: .
      dockerfile: Dockerfile-smtpdebug
    volumes:
      - smtp-debug-logs:/var/local/smtp-debug-logs:rw

volumes:
  smtp-debug-logs: {}

  # You can comment these out if you're not using the angular setup above, but
  # leaving them won't hurt, either, it just creates empty volumes.
  node-modules: {}
  angular-cache: {}

  # For caddyfile drop-ins, you can just redefine the volume. You can put an
  # inline bind volume on the web service, too, but this ensures you don't
  # forget the mode (readonly), and ensures the path keeps working if the main
  # compose file mounts "caddy-conf" to a different place.
  #
  # NOTE: this is still a bind mount, so you have to create the directory
  # manually, and podman won't delete the contents when you remove the volume.
  #
  #caddy-conf:
  #  driver: local
  #  driver_opts:
  #    type: none
  #    o: bind
  #    device: ${PWD}/DEV-VOLS/caddy-conf.d
