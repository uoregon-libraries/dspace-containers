# Configuration lives in `.env` and is interpolated here to avoid var
# duplication and keep all per-environment configuration central.
#
# - DO NOT use an override for *any* environment vars or you risk settings
#   drift, which can bite you in awful ways.
# - DO NOT alter ports in a compose override, use settings. We bind nearly
#   everything to loopback. It's necessary for Caddy to expose the ports, but
#   *critical* for security to keep them bound to the loopback interface.

networks:
  dspacenet:
    ipam:
      config:
        - subnet: ${DSPACE_SUBNET:-172.23.78.0/24}

services:
  # Caddy *runs on the host network* in order to see actual client IPs. It
  # sucks, we risk collisions, but it's necessary: we need to know IPs to let
  # site monitors bypass TPS, allow load testing to bypass TPS, log correctly
  # in case of abuse, etc.
  web:
    build:
      dockerfile: Dockerfile-caddy
    depends_on:
      - angular
      - rest
      - tps
    volumes:
      - request-logs:/var/log/caddy
    network_mode: host
    environment:
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-8080}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-static private_ranges}
      CADDY_DEBUG: ${CADDY_DEBUG:-}
      CADDY_ADMIN_CIDR: ${CADDY_ADMIN_CIDR:-127.0.0.1}
      CADDY_INTERNAL_MONITOR_CIDR: ${CADDY_INTERNAL_MONITOR_CIDR:-127.0.0.1}
      CADDY_INTERNAL_PORT: ${CADDY_INTERNAL_PORT:-18081}
      CADDY_ANGULAR_UPSTREAM: 127.0.0.1:${ANGULAR_HOST_PORT:-4000}
      CADDY_REST_UPSTREAM: 127.0.0.1:${REST_HOST_PORT:-8081}
      CADDY_TPS_UPSTREAM: 127.0.0.1:${TPS_HOST_PORT:-18888}

  angular:
    build:
      dockerfile: Dockerfile-angular
      # The default is the compiled production (SSR) server. For development
      # with the live-reload dev server, override the target to "dev" in your
      # compose override (see compose.override.example.yml).
      target: production
    depends_on:
      - rest
    ports:
      - "127.0.0.1:${ANGULAR_HOST_PORT:-4000}:4000"

    # Overrides for DSpace UI must start with "DSPACE_", replacing dots with
    # underscores, and arrays are addressed by giving an index number. The
    # HEADTAGS are here for reference, but they aren't actually being respected
    # for some reason.
    environment:
      DSPACE_THEMES_0_NAME: custom
      DSPACE_THEMES_0_HEADTAGS_0_TAGNAME: link
      DSPACE_THEMES_0_HEADTAGS_0_ATTRIBUTES_REL: icon
      DSPACE_THEMES_0_HEADTAGS_0_ATTRIBUTES_HREF: /path/to/favicon-32x32.png
      DSPACE_THEMES_0_HEADTAGS_0_ATTRIBUTES_SIZES: any

      # Where the UI server listens inside the container; the web proxy
      # forwards requests here
      DSPACE_UI_SSL: 'false'
      DSPACE_UI_HOST: 0.0.0.0
      DSPACE_UI_PORT: 4000
      DSPACE_UI_NAMESPACE: /

      # How many SSR worker processes pm2 runs
      PM2_INSTANCES: ${PM2_INSTANCES:-max}

      # Server-side rendering talks to REST directly over the internal
      # network instead of going out through the public URL
      DSPACE_REST_SSRBASEURL: http://rest:8080/server

      # The *public* REST URL, from the PUBLIC_* variables in .env. Do not
      # change the namespace: Caddy's routing depends on it.
      DSPACE_REST_SSL: "${PUBLIC_SSL:-false}"
      DSPACE_REST_HOST: ${PUBLIC_HOST:-localhost}
      DSPACE_REST_PORT: ${PUBLIC_PORT:-8080}
      DSPACE_REST_NAMESPACE: /server
    networks:
      dspacenet: {}

  rest:
    build:
      dockerfile: Dockerfile-rest
      args:
        MAVEN_FLAGS: ${MAVEN_FLAGS:-}
    ports:
      - "127.0.0.1:${REST_HOST_PORT:-8081}:8080"

    # The env key syntax may look odd, but it is how to override dspace.cfg
    # settings via env variables.
    #
    #   - `__P__` becomes `.` (e.g. dspace__P__dir => dspace.dir)
    #   - `__D__` becomes `-` (e.g. google__D__metadata => google-metadata)
    #
    # See https://github.com/DSpace/DSpace/blob/main/dspace/config/config-definition.xml
    environment:
      LOGGING_CONFIG: /usr/local/dspace/config/log4j2-container.xml
      dspace__P__name: ${DSPACE_NAME:-DSpace Started with Docker Compose}
      dspace__P__server__P__url: ${PUBLIC_URL:-http://localhost:8080}/server
      dspace__P__ui__P__url: ${PUBLIC_URL:-http://localhost:8080}
      proxies__P__trusted__P__ipranges: ${DSPACE_SUBNET:-172.23.78.0/24}
      dspace__P__server__P__ssr__P__url: http://rest:8080/server
      JAVA_OPTS: ${REST_JAVA_OPTS:--Xmx2000m}

    depends_on:
      - db
      - solr
    networks:
      dspacenet: {}
    volumes:
      - assetstore:/usr/local/dspace/assetstore

  db:
    build:
      dockerfile: Dockerfile-pgsql
    environment:
      POSTGRES_USER: dspace
      POSTGRES_PASSWORD: dspace
      POSTGRES_DB: dspace
    networks:
      dspacenet:
    volumes:
      - db:/var/lib/postgresql/data

  solr:
    build:
      dockerfile: Dockerfile-solr
    networks:
      dspacenet:
    volumes:
      - solr:/var/solr
    command: ["solr", "-f"]

  # TPS is host-networked like Caddy: it has to proxy challenged requests back
  # into Caddy's internal listener, which only exists on the host's loopback.
  tps:
    build:
      dockerfile: Dockerfile-tps
    network_mode: host
    depends_on:
      angular:
        condition: service_started
      rest:
        condition: service_started
    environment:
      GIN_MODE: "release"
      BIND_ADDR: 127.0.0.1:${TPS_HOST_PORT:-18888}
      PROXY_TARGET: http://127.0.0.1:${CADDY_INTERNAL_PORT:-18081}
      LOG_RETENTION: "24h"
      TOKEN_LIFETIME: 4h
      TOKEN_REQUEST_BUDGET: 1000
      TOKEN_IP_SWITCH_COST: 10

      # Secrets are required. The stack refuses to start if they aren't set.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?copy .env.example to .env and set the TPS secrets}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?copy .env.example to .env and set the TPS secrets}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?copy .env.example to .env and set the TPS secrets}
      ADMIN_SECRET: ${ADMIN_SECRET:?copy .env.example to .env and set the TPS secrets}
    volumes:
      - tps-data:/var/local/tps/data

volumes:
  request-logs: {}
  assetstore: {}
  db: {}
  solr: {}
  tps-data: {}
