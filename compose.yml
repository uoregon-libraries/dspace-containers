# Configuration lives in `.env` and is interpolated here to avoid var
# duplication and keep all per-environment configuration central.
#
# - DO NOT use an override for *any* environment vars or you risk settings
#   drift, which can bite you in awful ways.

networks:
  dspacenet:
    ipam:
      config:
        - subnet: ${DSPACE_SUBNET:?DSPACE_SUBNET must be set}

services:
  web:
    build:
      dockerfile: Dockerfile-caddy
    depends_on:
      - angular
      - rest
      - tps
    volumes:
      - request-logs:/var/log/caddy
      - caddy-conf:/etc/caddy/conf.d:ro
    networks:
      dspacenet: {}
    environment:
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:?CADDY_TRUSTED_PROXIES must be set}
      CADDY_DEBUG: ${CADDY_DEBUG:-}
      CADDY_ADMIN_CIDR: ${CADDY_ADMIN_CIDR:?CADDY_ADMIN_CIDR must be set}
      CADDY_INTERNAL_MONITOR_CIDR: ${CADDY_INTERNAL_MONITOR_CIDR:?CADDY_INTERNAL_MONITOR_CIDR must be set}
      CADDY_LOG_RETENTION: ${CADDY_LOG_RETENTION:-48h}
      CADDY_REST_HOST_HEADER: ${CADDY_REST_HOST_HEADER:?CADDY_REST_HOST_HEADER must be set}
      CADDY_ANGULAR_HOST_HEADER: ${CADDY_ANGULAR_HOST_HEADER:?CADDY_ANGULAR_HOST_HEADER must be set}
      CADDY_FORWARDED_PROTO: ${PUBLIC_SCHEME:?PUBLIC_SCHEME must be set}

  angular:
    build:
      dockerfile: Dockerfile-angular
      target: production
    depends_on:
      - rest
    volumes:
      - statistics:/app/dist/browser/assets/data:ro

    # Overrides for DSpace UI must start with "DSPACE_", replacing dots with
    # underscores, and arrays are addressed by giving an index number. Because
    # array overrides are a mess, anything that doesn't vary by environment
    # should be in the config file instead (see conf/angular/config.yml).
    environment:
      # Where the UI server listens inside the container; the web proxy
      # forwards requests here
      DSPACE_UI_SSL: 'false'
      DSPACE_UI_HOST: 0.0.0.0
      DSPACE_UI_PORT: 4000
      DSPACE_UI_NAMESPACE: /

      # How many SSR worker processes pm2 runs
      PM2_INSTANCES: ${PM2_INSTANCES:-max}

      # Server-side rendering talks to REST directly over the internal
      # network instead of going out through the public URL
      DSPACE_REST_SSRBASEURL: http://rest:8080/server

      # The *public* REST URL, from the PUBLIC_* variables in .env. Do not
      # change the namespace: Caddy's routing depends on it.
      DSPACE_REST_SSL: ${PUBLIC_SSL:?PUBLIC_SSL must be set}
      DSPACE_REST_HOST: ${PUBLIC_HOST:?PUBLIC_HOST must be set}
      DSPACE_REST_PORT: ${PUBLIC_PORT:?PUBLIC_PORT must be set}
      DSPACE_REST_NAMESPACE: /server

      # The amount of time in ms before the idle warning is shown
      DSPACE_AUTH_UI_TIMEUNTILIDLE: ${TIME_UNTIL_IDLE:-1800000}

      # Show the item access status label in items lists
      DSPACE_ITEM_SHOWACCESSSTATUSES: 'true'

      # Allow markdown in select metadata fields
      DSPACE_MARKDOWN_ENABLED: 'true'
    networks:
      dspacenet: {}

  rest:
    build:
      dockerfile: Dockerfile-rest
      args:
        MAVEN_FLAGS: ${MAVEN_FLAGS:-}

    secrets:
      - saml-sp.key
      - saml-sp.crt

    # The env key syntax may look odd, but it is how to override dspace.cfg
    # settings via env variables.
    #
    #   - `__P__` becomes `.` (e.g. dspace__P__dir => dspace.dir)
    #   - `__D__` becomes `-` (e.g. google__D__metadata => google-metadata)
    #
    # See https://github.com/DSpace/DSpace/blob/main/dspace/config/config-definition.xml
    environment:
      LOGGING_CONFIG: /usr/local/dspace/config/log4j2-container.xml

      dspace__P__name: ${DSPACE_NAME:?DSPACE_NAME must be set}
      dspace__P__shortname: ${DSPACE_NAME:?DSPACE_NAME must be set}
      dspace__P__server__P__url: ${PUBLIC_URL:?PUBLIC_URL must be set}/server
      dspace__P__ui__P__url: ${PUBLIC_URL:?PUBLIC_URL must be set}
      proxies__P__trusted__P__ipranges: ${DSPACE_SUBNET:?DSPACE_SUBNET must be set}
      dspace__P__server__P__ssr__P__url: http://rest:8080/server

      mail__P__server: ${MAIL_SERVER:?MAIL_SERVER must be set}
      mail__P__from__P__address: ${FROM_ADDRESS:?FROM_ADDRESS must be set}
      mail__P__admin: ${MAIL_ADMIN:?MAIL_ADMIN must be set}

      handle__P__canonical__P__prefix: https://hdl.handle.net/
      handle__P__prefix: ${HANDLE_PREFIX:-12345678}

      crosswalk__D__dissemination__D__DataCite__D__publisher: ${DSPACE_NAME:?DSPACE_NAME must be set}

      google__P__analytics__P__key: ${GA_KEY:-}
      
      webui__P__strengths__P__show: true
      webui__P__user__P__assumelogin: true

      embargo__P__field__P__terms: dc.description.embargo
      embargo__P__field__P__lift: dc.description.embargo

      JAVA_OPTS: ${REST_JAVA_OPTS:-}

      plugin__P__sequence__P__org__P__dspace__P__authenticate__P__AuthenticationMethod: >-
        org.dspace.authenticate.IPAuthentication,
        org.dspace.authenticate.PasswordAuthentication,
        org.dspace.authenticate.SamlAuthentication
      authentication__D__saml__P__relying__D__party__D__id: ${SAML_RELYING_PARTY_ID:?SAML_RELYING_PARTY_ID must be set}
      authentication__D__saml__P__autoregister: ${SAML_AUTOREGISTER:-false}
      authentication__D__ip__P__UO\ Only: ${AUTHENTICATION_IPS:-}
      # The relying-party ID is part of these keys, and compose can't
      # interpolate keys, so the REST entrypoint rewrites "X_SAML_<rest>" to
      # "saml__D__relying__D__party__P__<id>__P__<rest>".
      X_SAML_asserting__D__party__P__metadata__D__uri: ${SAML_IDP_METADATA_URI:?SAML_IDP_METADATA_URI must be set}
      X_SAML_attributes: ${SAML_ATTRIBUTES:?SAML_ATTRIBUTES must be set}
      X_SAML_signing__P__credentials__P__0__P__private__D__key__D__location: file:///run/secrets/saml-sp.key
      X_SAML_signing__P__credentials__P__0__P__certificate__D__location: file:///run/secrets/saml-sp.crt

      rest__P__cors__P__allowed__D__origins: ${REST_ALLOWED_ORIGINS:?REST_ALLOWED_ORIGINS must be set}

    depends_on:
      - db
      - solr
    networks:
      dspacenet: {}
    # This is certainly far more volumes than necessary, but it's not obvious
    # what we definitely will never use, and a container restart shouldn't
    # wreck workflows...
    volumes:
      - assetstore:/usr/local/dspace/assetstore
      - statistics:/usr/local/dspace/statistics
      - sitemaps:/usr/local/dspace/sitemaps
      - oai-cache:/usr/local/dspace/var/oai
      - curation-queues:/usr/local/dspace/ctqueues
      - exports:/usr/local/dspace/exports
      - imports:/usr/local/dspace/imports
      - reports:/usr/local/dspace/reports
      # Tomcat won't write logs here, but we mount it here since "cli" inherits
      # this setting, and then we catch any one-offs accidentally run against
      # the "rest" service
      - cli-logs:/usr/local/dspace/log

  # "cli": one-off DSpace commands (cron jobs / admin tasks), e.g.:
  #
  #   docker compose --profile tools run --rm --no-deps -T cli index-discovery -b
  #
  # See README.md for more details.
  cli:
    extends:
      service: rest
    profiles: [tools]
    environment:
      JAVA_OPTS: ${CLI_JAVA_OPTS:-}

  db:
    build:
      dockerfile: Dockerfile-pgsql
    environment:
      POSTGRES_USER: dspace
      POSTGRES_PASSWORD: dspace
      POSTGRES_DB: dspace
    networks:
      dspacenet:
    volumes:
      - db:/var/lib/postgresql/data

  solr:
    build:
      dockerfile: Dockerfile-solr
    networks:
      dspacenet:
    volumes:
      - solr:/var/solr
    command: ["solr", "-f"]

  tps:
    build:
      dockerfile: Dockerfile-tps
    networks:
      dspacenet: {}
    depends_on:
      angular:
        condition: service_started
      rest:
        condition: service_started
    environment:
      GIN_MODE: "release"
      BIND_ADDR: ":8080"
      PROXY_TARGET: http://web:18081
      LOG_RETENTION: "24h"
      TOKEN_LIFETIME: 4h
      TOKEN_REQUEST_BUDGET: 1000
      TOKEN_IP_SWITCH_COST: 10

      # Secrets are required. The stack refuses to start if they aren't set.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?copy .env.example to .env and set the TPS secrets}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?copy .env.example to .env and set the TPS secrets}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?copy .env.example to .env and set the TPS secrets}
      ADMIN_SECRET: ${ADMIN_SECRET:?copy .env.example to .env and set the TPS secrets}
    volumes:
      - tps-data:/var/local/tps/data

  # Local dev only, enable via COMPOSE_PROFILES in `.env`.
  #
  # Env values use `:-`, never `:?`, because podman-compose interpolates
  # services even when their profile is off.

  # Captures outgoing mail instead of sending it. Set MAIL_SERVER=smtpdebug.
  smtpdebug:
    build:
      dockerfile: Dockerfile-smtpdebug
    profiles: [local-dev]
    networks:
      dspacenet: {}
    volumes:
      - smtp-debug-logs:/var/local/smtp-debug-logs:rw

  # SAML IdP (go-saml); see "IdP" in README.md. Its entrypoint refuses to
  # start if the URLs are blank.
  idp:
    build:
      dockerfile: Dockerfile-idp
    profiles: [local-dev]
    networks:
      dspacenet: {}
    environment:
      IDP_BASE_URL: ${DEV_IDP_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      DEV_IDP_USERS: ${DEV_IDP_USERS:-}

volumes:
  request-logs: {}
  assetstore: {}
  db: {}
  solr: {}
  tps-data: {}
  caddy-conf: {}
  statistics: {}
  cli-logs: {}
  sitemaps: {}
  oai-cache: {}
  curation-queues: {}
  exports: {}
  imports: {}
  reports: {}
  smtp-debug-logs: {}

secrets:
  saml-sp.key:
    file: ${SAML_SP_KEY_FILE:?SAML_SP_KEY_FILE must be set}
  saml-sp.crt:
    file: ${SAML_SP_CERT_FILE:?SAML_SP_CERT_FILE must be set}
