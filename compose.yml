# We define a custom subnet so we know what network to allow DSpace to trust.
# Its netmask and the service IPs *must be set in the compose override*
# otherwise DSpace cannot function!
networks:
  dspacenet: {}

services:
  web:
    build:
      dockerfile: Dockerfile-caddy
    depends_on:
      - angular
      - rest
      - tps
    networks:
      dspacenet: {}

  angular:
    build:
      dockerfile: Dockerfile-angular
      # The default is the compiled production (SSR) server. For development
      # with the live-reload dev server, override the target to "dev" in your
      # compose override (see compose.override.example.yml).
      target: production
    depends_on:
      - rest

    # Overrides for DSpace UI must start with "DSPACE_", replacing dots with
    # underscores, and arrays are addressed by giving an index number. The
    # HEADTAGS are here for reference, but they aren't actually being respected
    # for some reason.
    environment:
      DSPACE_THEMES_0_NAME: custom
      DSPACE_THEMES_0_HEADTAGS_0_TAGNAME: link
      DSPACE_THEMES_0_HEADTAGS_0_ATTRIBUTES_REL: icon
      DSPACE_THEMES_0_HEADTAGS_0_ATTRIBUTES_HREF: /path/to/favicon-32x32.png
      DSPACE_THEMES_0_HEADTAGS_0_ATTRIBUTES_SIZES: any

      # Where the UI server listens inside the container; the web proxy
      # forwards requests here
      DSPACE_UI_SSL: 'false'
      DSPACE_UI_HOST: 0.0.0.0
      DSPACE_UI_PORT: 4000
      DSPACE_UI_NAMESPACE: /

      # Server-side rendering talks to REST directly over the internal
      # network instead of going out through the public URL
      DSPACE_REST_SSRBASEURL: http://rest:8080/server

      # The *public* REST URL. These defaults work for a local stack exposed
      # on port 8080; real deployments must override them (see
      # compose.override.example.yml).
      DSPACE_REST_SSL: 'false'
      DSPACE_REST_HOST: localhost
      DSPACE_REST_PORT: 8080
      DSPACE_REST_NAMESPACE: /server
    networks:
      dspacenet: {}

  rest:
    build:
      dockerfile: Dockerfile-rest

    # The env key syntax may look odd, but it is how to override dspace.cfg
    # settings via env variables.
    #
    #   - `__P__` becomes `.` (e.g. dspace__P__dir => dspace.dir)
    #   - `__D__` becomes `-` (e.g. google__D__metadata => google-metadata)
    #
    # See https://github.com/DSpace/DSpace/blob/main/dspace/config/config-definition.xml
    environment:
      # You *could* override this if you know what you're doing. But you
      # probably shouldn't.
      LOGGING_CONFIG: /usr/local/dspace/config/log4j2-container.xml

      # You probably want to override these, or at least verify they make sense
      # for your setup
      dspace__P__name: 'DSpace Started with Docker Compose'
      dspace__P__server__P__ssr__P__url: http://rest:8080/server
      JAVA_OPTS: -Xmx2000m

    depends_on:
      - db
      - solr
    networks:
      dspacenet: {}
    volumes:
      - assetstore:/usr/local/dspace/assetstore

  db:
    build:
      dockerfile: Dockerfile-pgsql
    environment:
      POSTGRES_USER: dspace
      POSTGRES_PASSWORD: dspace
      POSTGRES_DB: dspace
    networks:
      dspacenet:
    volumes:
      - db:/var/lib/postgresql/data

  solr:
    build:
      dockerfile: Dockerfile-solr
    networks:
      dspacenet:
    volumes:
      - solr:/var/solr
    command: ["solr", "-f"]

  tps:
    build:
      dockerfile: Dockerfile-tps
    depends_on:
      angular:
        condition: service_started
      rest:
        condition: service_started
    environment:
      GIN_MODE: "release"
      BIND_ADDR: ":18888"
      PROXY_TARGET: "http://web:18081"
      TOKEN_LIFETIME: 4h
      TOKEN_REQUEST_BUDGET: 1000
      TOKEN_IP_SWITCH_COST: 10
    volumes:
      - tps-data:/var/local/tps/data

volumes:
  assetstore: {}
  db: {}
  solr: {}
  tps-data: {}
